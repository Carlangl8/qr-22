<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    if (!sessionStorage.getItem('adminToken')) {
      window.location.href = 'login.html';
    }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de invitados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .list-wrapper {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 16px;
    }
    .stats-card {
      background: rgba(15, 10, 25, 0.8);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      border: 1px solid rgba(192, 38, 211, 0.5);
      display: flex;
      justify-content: space-around;
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .stat-item h3 {
      font-size: 2rem;
      color: #fff;
      text-shadow: 0 0 10px #c026d3;
      margin-bottom: 4px;
    }
    .stat-item p {
      color: #c4b5fd;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .guest-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .guest-item {
      background: rgba(15, 10, 25, 0.8);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(124, 58, 237, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }
    .guest-item:hover {
      border-color: rgba(192, 38, 211, 0.6);
      transform: translateY(-2px);
    }
    .guest-info h4 {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 4px;
    }
    .guest-info .time {
      font-size: 0.8rem;
      color: #c4b5fd;
    }
    .status-badge {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-align: center;
      min-width: 100px;
    }
    .status-badge.arrived {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid #059669;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
    }
    .status-badge.pending {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid #d97706;
    }
  </style>
</head>
<body>
  <div class="list-wrapper">
    <header class="main-header">
      <h1>Lista de Invitados</h1>
      <p class="subtitle">Estado en tiempo real de los asistentes a la fiesta.</p>
    </header>

    <div class="stats-card">
      <div class="stat-item">
        <h3 id="stat-total">0</h3>
        <p>Total</p>
      </div>
      <div class="stat-item">
        <h3 id="stat-arrived">0</h3>
        <p>Han llegado</p>
      </div>
      <div class="stat-item">
        <h3 id="stat-pending">0</h3>
        <p>Faltan</p>
      </div>
    </div>

    <div class="guest-list" id="guest-list-container">
      <p style="text-align: center; color: #c4b5fd;">Cargando invitados...</p>
    </div>

    <footer class="main-footer" style="margin-top: 40px;">
      <p>
        <a href="admin.html" style="font-size: 1.1rem; color: #fff; background: rgba(192, 38, 211, 0.4); padding: 8px 16px; border-radius: 999px; text-decoration: none; display: inline-block; margin-bottom: 12px; border: 1px solid rgba(192, 38, 211, 0.6);">📷 Escanear QR</a><br>
        <a href="index.html">← Volver a la página pública</a>
      </p>
    </footer>
  </div>

  <script src="lista.js"></script>
</body>
</html>
