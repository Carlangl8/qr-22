<!DOCTYPE html>
<html lang="es">
  <head>
    <script>
      if (!sessionStorage.getItem('adminToken')) {
        window.location.href = 'login.html';
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel admin - Escanear invitados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
      .admin-wrapper {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .admin-card {
        margin-top: 16px;
        padding: 24px;
        border-radius: 20px;
        background: rgba(15, 10, 25, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(192, 38, 211, 0.5);
        box-shadow: 0 0 40px rgba(124, 58, 237, 0.4), 0 0 80px rgba(192, 38, 211, 0.2);
        width: 100%;
      }
      #reader {
        width: 100%;
        margin: 0 auto;
        border: 2px solid rgba(124, 58, 237, 0.5);
        border-radius: 12px;
        /* Removed overflow: hidden because html5-qrcode video might need its flow */
        box-shadow: 0 0 15px rgba(124, 58, 237, 0.3);
        min-height: 250px;
        background: rgba(0,0,0,0.5);
        position: relative;
      }
      #reader video, #reader canvas {
        border-radius: 10px !important; /* Forces internal element to look nice */
      }
      
      /* Make scanner text readable against dark background */
      #reader * {
        color: #fff;
        font-family: 'Outfit', sans-serif;
      }

      #resultado {
        margin-top: 24px;
        text-align: center;
        font-size: 1.2rem;
        color: #fff;
        text-shadow: 0 0 10px #c026d3;
        font-weight: 600;
        min-height: 30px;
      }
      .main-header {
        text-align: center;
        margin-bottom: 24px;
      }
      .main-footer {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- Background is now shared via body styles in styles.css -->
    <div class="admin-wrapper">
      <header class="main-header">
        <h1>Escanear QR</h1>
        <p class="subtitle">
          Apunta la cámara al pase de invitación para asistir a la fiesta.
        </p>
      </header>

      <main style="width: 100%">
        <section class="admin-card">
          <div id="reader"></div>
          <h2 id="resultado">Esperando código...</h2>
        </section>
      </main>

      <footer class="main-footer">
        <p>
          <a href="lista.html" style="font-size: 1.1rem; color: #fff; background: rgba(192, 38, 211, 0.4); padding: 8px 16px; border-radius: 999px; text-decoration: none; display: inline-block; margin-bottom: 12px; border: 1px solid rgba(192, 38, 211, 0.6);">📋 Ver lista de invitados</a><br>
          <a href="admin-juego.html" style="font-size: 1.1rem; color: #fff; background: rgba(124, 58, 237, 0.4); padding: 8px 16px; border-radius: 999px; text-decoration: none; display: inline-block; margin-bottom: 12px; border: 1px solid rgba(124, 58, 237, 0.6);">🎮 Quién (Juego)</a><br>
          <a href="index.html">← Volver a la página pública</a>
        </p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
